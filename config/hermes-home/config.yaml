model:
  # 260829: perfil `default`/`general` — CLI + conversas diretas (DM Telegram
  # 136116937/"VJ pixel"). A cadeia alinhada ao continuo (dots-3 -> laguna ->
  # glm-5.3-flash) migrou pro perfil dedicado `coding` (issue #7,
  # vjpixel/hermes), que roda isolado (config/credenciais/memoria/skills
  # proprios). Esta e a cadeia definitiva do default: Dots (primary) ->
  # Inkling -> Laguna -> Luna (assinatura ChatGPT) -> glm-5.3-flash (pago por
  # token) -> local (qwen-64k, ultimo recurso). Estado anterior (primary
  # local + cadeia de 7 degraus antiga) preservado em
  # config.yaml.bak-primary-fallback-align-continuo-260829.
  default: dots-studio/dots-3-note-preview:free
  provider: openrouter
  max_tokens: 16384
  aliases:
    luna: openai-codex/gpt-5.6-luna
    terra: openai-codex/gpt-5.6-terra
    nemotron: nvidia/nemotron-3-ultra-550b-a55b:free
    dots: dots-studio/dots-3-note-preview:free
    flash: z-ai/glm-5.3-flash
    laguna: poolside/laguna-s-2.1:free
  alias:
    qwen-local: provider=custom,model=qwen-64k:latest,base_url=http://127.0.0.1:11434/v1
    qwen: provider=custom,model=qwen-64k,base_url=http://127.0.0.1:11434/v1
fallback_providers:
  - provider: openrouter
    model: thinkingmachines/inkling:free
  - provider: openrouter
    model: poolside/laguna-s-2.1:free
  - provider: openai-codex
    model: gpt-5.6-luna
  # 260830: degrau glm-5.3-flash REMOVIDO (decisao do editor). Ele era
  # TEMPORARIO desde 260829, valido so enquanto openai-codex/gpt-5.6-luna
  # estivesse indisponivel por falta de credito -- condicao de saida cumprida:
  # as 2 credenciais openai-codex do auth.json (vjpixel, diaria.editor) estao
  # com last_status: ok. O glm continua vivo, de proposito, no lado Claude:
  # MODELS_DEFAULT de hermes/scripts/claude-openrouter.sh (diaria-studio).
  # Historico: config.yaml.bak-glm-out-260830. Ver diaria-studio#6791.
  # qwen local e ULTIMO RECURSO por decisao de QUALIDADE (editor, 260829: "o
  # qwen e muito ruim"), nao por custo. Nao promover pra primary pra economizar
  # cota -- foi proposto em 260829 e recusado com esse motivo.
  - provider: custom
    model: qwen-64k:latest
    base_url: http://127.0.0.1:11434/v1
