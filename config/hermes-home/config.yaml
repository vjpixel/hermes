# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

# ── Gateway multiplex (vjpixel/hermes#8) ────────────────────────────────
# Routes the 'continuo' Telegram group to the isolated `coding` profile
# (config/credentials/memory/skills separate from default), created in #7.
# CLI + personal DM stay on default/general.
#
# Added by #8 step 1-2 only (safe/additive — has zero effect until the
# gateway service restarts). Steps 3-4 (move cron job 5d791ef6fc2c to the
# coding profile's storage, staged disabled -> confirmed -> old job
# disabled -> deleted) were deliberately NOT done here: no `hermes cron`
# CLI verb moves a job between profile storages, and getting this wrong
# risks the exact duplicate-execution failure #8 warns about (the tick
# firing from BOTH the default and coding storage at once, two harnesses
# hitting the same shared diaria-studio checkout). That step needs to be
# done live, one confirmed tick at a time, by whoever restarts the
# gateway — see #8 for the full staged procedure.
gateway:
  multiplex_profiles: true
  profile_routes:
    - name: continuo-coding
      platform: telegram
      chat_id: "-5506740603"   # grupo "diaria-continuo" (channel_directory.json)
      profile: coding
