model:
  # 260829: perfil `default`/`general` — CLI + conversas diretas (DM Telegram
  # 136116937/"VJ pixel"). A cadeia alinhada ao continuo (dots-3 -> laguna ->
  # glm-5.3-flash) migrou pro perfil dedicado `coding` (issue #7,
  # vjpixel/hermes), que roda isolado (config/credenciais/memoria/skills
  # proprios). Esta e a cadeia definitiva do default: Dots (primary) ->
  # Inkling -> Laguna -> Luna (assinatura ChatGPT) -> glm-5.3-flash (pago por
  # token) -> local (qwen-64k, ultimo recurso). Estado anterior (primary
  # local + cadeia de 7 degraus antiga) preservado em
  # config.yaml.bak-primary-fallback-align-continuo-260829.
  default: dots-studio/dots-3-note-preview:free
  provider: openrouter
  max_tokens: 16384
  aliases:
    luna: openai-codex/gpt-5.6-luna
    terra: openai-codex/gpt-5.6-terra
    nemotron: nvidia/nemotron-3-ultra-550b-a55b:free
    dots: dots-studio/dots-3-note-preview:free
    flash: z-ai/glm-5.3-flash
    laguna: poolside/laguna-s-2.1:free
  alias:
    qwen-local: provider=custom,model=qwen-64k:latest,base_url=http://127.0.0.1:11434/v1
    qwen: provider=custom,model=qwen-64k,base_url=http://127.0.0.1:11434/v1
fallback_providers:
  - provider: openrouter
    model: thinkingmachines/inkling:free
  - provider: openrouter
    model: poolside/laguna-s-2.1:free
  - provider: openai-codex
    model: gpt-5.6-luna
  # 260830: degrau glm-5.3-flash REMOVIDO (decisao do editor). Ele era
  # TEMPORARIO desde 260829, valido so enquanto openai-codex/gpt-5.6-luna
  # estivesse indisponivel por falta de credito -- condicao de saida cumprida:
  # as 2 credenciais openai-codex do auth.json (vjpixel, diaria.editor) estao
  # com last_status: ok. O glm continua vivo, de proposito, no lado Claude:
  # MODELS_DEFAULT de hermes/scripts/claude-openrouter.sh (diaria-studio).
  # Historico: config.yaml.bak-glm-out-260830. Ver diaria-studio#6791.
  # qwen local e ULTIMO RECURSO por decisao de QUALIDADE (editor, 260829: "o
  # qwen e muito ruim"), nao por custo. Nao promover pra primary pra economizar
  # cota -- foi proposto em 260829 e recusado com esse motivo.
  - provider: custom
    model: qwen-64k:latest
    base_url: http://127.0.0.1:11434/v1
compression:
  # diaria-studio#6712. Teto ABSOLUTO do gatilho de compactacao; vence o
  # percentual via min(cap, context_length). Sem ele, o gatilho e
  # context_length x 50% — e os modelos da cadeia declaram janelas de 1,31M
  # (glm-5.3-flash) e 1,05M (inkling:free), ou seja 655K e 524K. Medido em
  # 31/08/2026: um tick chegou a 182K de contexto sem NUNCA compactar.
  #
  # ATENCAO: esta chave e de TOPO, nao vai sob `agent:`. agent_init.py le
  # load_config_readonly()['compression']['threshold_tokens']. Posta sob
  # `agent:` ela e silenciosamente ignorada (erro cometido em 31/08, custou
  # duas medicoes).
  #
  # 150K derivado do piso incompressivel (~54,3K baseline + ~20K cauda
  # protegida + sumario ~= 90K): folga de ~60K, cerca de 21-40 chamadas entre
  # compactacoes na taxa medida de 1,5-2,8K tokens/chamada. Abaixo de ~120K
  # cai no thrash que o proprio compressor documenta.
  threshold_tokens: 150000
agent:
  max_turns: 150
  # reasoning_overrides (30/08/2026, decisão do editor pós #6816/#6824):
  # o override equivalente em ~/.hermes/profiles/coding/config.yaml NÃO
  # alcança o hermes-diaria-continuo — o job roda no cron da RAIZ
  # (~/.hermes/cron/jobs.json), não no perfil coding (#6824, achado
  # confirmado em disco). Este bloco global é a saída (A) da #6824:
  # alcança o contínuo hoje, sem mover o job de perfil (saída B, fica
  # pra junto do #6771). Efeito colateral aceito: vale também pras
  # sessões interativas do editor — é o desejado (high como default,
  # max pedido à mão). TTFT medido no gpt-5.6-luna: medium 2,43s |
  # high 16,51s | max 167,97s — high é o piso aceitável de latência
  # pro ganho de raciocínio; max é caro demais pro caminho default.
  reasoning_overrides:
    gpt-5.6-luna: high
terminal:
  cwd: /home/vjpixel/hermes-agent
  env: local
web:
  backend: ddgs
  use_gateway: false
browser:
  cloud_provider: local
  use_gateway: false
context_file_max_chars: 100000
auxiliary:
  # O auto-chain auxiliar cai em google/gemini-3.6-flash (PAGO) por default —
  # foi de onde vieram os usos de gemini que nao estao em lugar nenhum deste
  # arquivo. Trocado por um :free. NAO ligar free_only: true aqui: ele barra
  # tambem o `model` explicito de cada tarefa (tests/agent/test_auxiliary_client
  # .py::test_explicit_caller_model_respects_free_only), o que desligaria a
  # visao abaixo (glm-5.3-flash e pago, e o qwen local e so texto).
  openrouter_model: dots-studio/dots-3-note-preview:free
  vision:
    # Visao NAO tem fallback local (qwen-64k e so texto), entao a escolha aqui
    # e entre modelos de nuvem. Opcoes :free com entrada de imagem, medidas em
    # 27/08/2026: dots-3 (texto+imagem, 512k), inkling e inkling-small
    # (texto+imagem+audio, 1M), minimax-m3 (texto+imagem+VIDEO, 1M),
    # gemma-4-31b/26b (imagem+texto+video, 262k).
    # dots-3 e o primario por ja ser o que rodava aqui antes; minimax-m3 vem
    # logo atras por cobrir video; glm-5.3-flash (PAGO, USD 0,075/M) fica como
    # ultimo recurso, so quando o balde :free ja esgotou.
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
    fallback_chain:
      - provider: openrouter
        model: minimax/minimax-m3:free
      - provider: openai-codex
        model: gpt-5.6-luna
      - provider: openrouter
        model: z-ai/glm-5.3-flash
      # NAO reintroduzir o qwen-64k local aqui: e modelo so-texto, entao como
      # ultimo elo de uma cadeia de VISAO ele nunca resolve a chamada.
  web_extract:
    provider: main
    fallback_chain:
      - provider: openrouter
        model: dots-studio/dots-3-note-preview:free
      - provider: openai-codex
        model: gpt-5.6-luna
      - provider: custom
        model: qwen-64k:latest
        base_url: http://127.0.0.1:11434/v1
  compression:
    provider: main
    fallback_chain:
      - provider: openrouter
        model: dots-studio/dots-3-note-preview:free
      - provider: openai-codex
        model: gpt-5.6-luna
      - provider: custom
        model: qwen-64k:latest
        base_url: http://127.0.0.1:11434/v1
  skills_hub:
    provider: main
    fallback_chain:
