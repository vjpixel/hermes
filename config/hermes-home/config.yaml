custom_providers: []
# #6673: restringe o picker do /model aos modelos declarados em
# smart_model_routing (primario + fallback chains) + picker_extras.
# Valores: all (default, inventario inteiro) | routing.
model_catalog:
  picker_scope: routing

smart_model_routing:
  enabled: true
  # #6620 (28/08): estava `coding` — todo uso geral do Hermes entrava pelo
  # perfil de codificacao por padrao. Decisao do editor: `general` e o
  # default mais conservador pra chamadas nao classificadas, agora que ele
  # ganhou fallback_chain propria (general_fallback, abaixo) em vez de
  # compartilhar a de `coding`.
  default_profile: general
  profiles:
    coding:
      # 260829: alinhado com a cadeia do wrapper
      # hermes/scripts/claude-openrouter.sh (MODELS_DEFAULT) do repo
      # diaria-studio, usado pelo hermes-diaria-continuo — decisao do editor
      # de que a cadeia ja validada em producao pelo continuo deveria ser a
      # cadeia de `coding` do Hermes, em vez de terem divergido. Historico
      # anterior (qwen-64k local via #6645) preservado em
      # config.yaml.bak-coding-align-continuo-260829.
      primary_model: dots-studio/dots-3-note-preview:free
      provider: openrouter
      fallback_chain_key: coding_fallback
    simple:
      primary_model: dots-studio/dots-3-note-preview:free
      provider: openrouter
      fallback_chain_key: simple_fallback
    general:
      # #6620 (28/08): estava fallback_chain_key: coding_fallback — general e
      # coding compartilhavam a mesma cadeia (3 perfis, 2 cadeias). Cadeia
      # propria agora, pra degradar sem herdar custo/quota de coding.
      primary_model: poolside/laguna-s-2.1:free
      provider: openrouter
      fallback_chain_key: general_fallback
  fallback_chains:
    # Cada degrau falha por um motivo INDEPENDENTE. Os :free do OpenRouter
    # compartilham um balde diario por CONTA — empilhar varios deles nao cria
    # degraus, so nomes que morrem juntos no mesmo 429. Mantemos 2 (cobrem
    # falha de MODELO, nao de quota) e o resto muda de fonte de falha.
    coding_fallback:
      # 260829: espelha MODELS_DEFAULT do wrapper claude-openrouter.sh
      # (diaria-studio) — mesma cadeia primary+fallback usada pelo
      # hermes-diaria-continuo. balde free diario do degrau 1 e independente
      # do primary (dots-3-note-preview); degrau 2 e pago por token, saldo
      # independente do balde free.
      - provider: openrouter
        model: poolside/laguna-s-2.1:free
      - provider: openrouter
        model: z-ai/glm-5.3-flash
    # #6620 (28/08): cadeia propria de `general` (nao compartilha mais com
    # coding_fallback). Primeiro degrau evita repetir o primary_model de
    # general (poolside/laguna-s-2.1:free) — senao o degrau 1 falharia pelo
    # mesmo motivo que o primary acabou de falhar. Mesmo principio do
    # comentario acima de coding_fallback: cada degrau muda de fonte de
    # falha (modelo -> modelo -> assinatura -> saldo pago), nunca termina no
    # modelo local (esse e o formato conservador que a decisao do editor
    # pediu — diferente de simple_fallback, que termina em qwen-64k local).
    general_fallback:
      - provider: openrouter
        model: thinkingmachines/inkling:free
      - provider: openrouter
        model: dots-studio/dots-3-note-preview:free
      # assinatura ChatGPT — quota independente do OpenRouter
      - provider: openai-codex
        model: gpt-5.6-luna
      # pago por token — saldo independente do balde free
      - provider: openrouter
        model: z-ai/glm-5.3-flash
    simple_fallback:
      - provider: openrouter
        model: poolside/laguna-s-2.1:free
      - provider: openrouter
        model: dots-studio/dots-3-note-preview:free
      - provider: openrouter
        model: thinkingmachines/inkling:free
      - provider: openai-codex
        model: gpt-5.6-luna
      - provider: custom
        model: qwen-64k:latest
        base_url: http://127.0.0.1:11434/v1
model_aliases:
  qwen:
    model: qwen-64k:latest
    base_url: http://127.0.0.1:11434/v1
  dots:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  nemotron:
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
  luna:
