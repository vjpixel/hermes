    # dots-3 e o primario por ja ser o que rodava aqui antes; minimax-m3 vem
    # logo atras por cobrir video; glm-5.3-flash (PAGO, USD 0,075/M) fica como
    # ultimo recurso, so quando o balde :free ja esgotou.
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
    fallback_chain:
      - provider: openrouter
        model: minimax/minimax-m3:free
      - provider: openai-codex
        model: gpt-5.6-luna
      - provider: openrouter
        model: z-ai/glm-5.3-flash
