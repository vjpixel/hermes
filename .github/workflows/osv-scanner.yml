name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR/push (via the ci.yml orchestrator's workflow_call)
# and on a weekly schedule against main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions so we can
# decide when and how to patch on our own schedule. Our pinning strategy
# (full SHA / exact version) is preserved; only the notification signal
# is added.
#
# Complements the supply-chain-audit.yml workflow (which scans for malicious
# code patterns in PR diffs) by covering the orthogonal "currently-pinned
# dep became known-vulnerable" case.
#
# Uses Google's officially-recommended reusable workflow, pinned by SHA.
# Findings land in the "review status" PR comment below (via the SARIF
# artifact) — NOT the Security tab, since Code Scanning requires GitHub
# Advanced Security, which this private repo doesn't have.
# fail-on-vuln is disabled so the job does not block merges on pre-existing
# vulnerabilities in pinned deps that we may need to patch deliberately.
#
# The reusable workflow can't emit custom outputs, so a wrapper job
# downloads the SARIF result and summarizes the vulnerability count into
# a review_status for the unified PR comment.

on:
  workflow_call:
  schedule:
    # Weekly scan against main — catches CVEs published after merge for
    # deps that haven't changed since.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # Unused while upload-sarif is false above (kept so re-enabling Code
  # Scanning later, if GitHub Advanced Security gets turned on for this
  # private repo, is a one-line flip instead of a permissions PR too).
  # See: https://github.com/github/codeql-action/issues/2117
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # Scan explicit lockfiles rather than recursing, so we only look at
      # the five sources of truth and skip vendored / test / worktree dirs.
      scan-args: |-
        --lockfile=uv.lock
        --lockfile=package-lock.json
        --lockfile=website/package-lock.json
        --lockfile=plugins/platforms/photon/sidecar/package-lock.json
        --lockfile=scripts/whatsapp-bridge/package-lock.json
      # The upstream reusable workflow uploads this exact file under its
      # fixed artifact name, which the wrapper downloads below.
      results-file-name: osv-results.sarif
      fail-on-vuln: false
      # This repo is private without GitHub Advanced Security, so Code
      # Scanning is not enabled — the "Upload to code-scanning" step fails
      # every run with "Code scanning is not enabled for this repository."
      # The SARIF artifact is still uploaded and read by emit-status below
      # regardless of this flag, so turning it off only drops the (currently
      # broken) Security-tab integration, not the vulnerability reporting.
      upload-sarif: false

  emit-status:
    name: Emit review status
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    outputs:
      review_status: ${{ steps.emit.outputs.review_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SARIF result
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OSV Scanner SARIF file
          path: /tmp/osv-results
        continue-on-error: true

      - name: Emit review_status
        id: emit
        run: |
          set -euo pipefail
          STATUS="[]"

          # The "scan" job's own steps already tolerate failure (Run scanner
          # has continue-on-error, fail-on-vuln is false), so nothing upstream
          # of this job fails loudly on a real problem. Without this check,
          # a download failure (artifact expired, naming drift on an action
          # bump, upload-artifact outage) silently reads as "0 vulnerabilities
          # found" instead of "the pipeline broke" — see #24 review.
          if [ "${{ steps.download.outcome }}" = "failure" ]; then
            echo "::error::OSV scan artifact download failed — could not verify vulnerability status, this is NOT the same as 0 vulnerabilities found."
            STATUS='[{"source":"osv scan","results":[{"kind":"action_required","title":"OSV scan status unknown","summary":"The SARIF artifact download failed, so vulnerability status for this PR could not be determined.","how_to_fix":"Re-run the failed job. If it keeps failing, check whether the scan job'\''s artifact name/retention changed (google/osv-scanner-action bump) or actions/download-artifact is degraded."}]}]'
            echo "review_status=${STATUS}" >> "$GITHUB_OUTPUT"
            echo "review_status=${STATUS}" > review-status.json
            exit 1
          fi

          if [ -f /tmp/osv-results/osv-results.sarif ]; then
            # Count vulnerabilities from the SARIF file
            VULN_COUNT=$(python3 -c "
          import json, sys
          try:
              with open('/tmp/osv-results/osv-results.sarif') as f:
                  data = json.load(f)
              count = 0
              vulns = []
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      count += 1
                      rule_id = result.get('ruleId', 'unknown')
                      message = result.get('message', {}).get('text', '')
                      loc = result.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                      vulns.append(f'- {rule_id} in {loc}: {message}')
              print(count)
              if vulns:
                  print('\n'.join(vulns[:20]), file=sys.stderr)
          except Exception:
              print(0)
          ")

            VULN_DETAIL=""
            if [ "$VULN_COUNT" -gt 0 ] 2>/dev/null; then
              VULN_PLURAL=$([ "$VULN_COUNT" -eq 1 ] && echo "y" || echo "ies")
              VULN_DETAIL=$(python3 -c "
          import json, sys
          try:
              with open('/tmp/osv-results/osv-results.sarif') as f:
                  data = json.load(f)
              vulns = []
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      rule_id = result.get('ruleId', 'unknown')
                      loc = result.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                      vulns.append(f'- {rule_id} in {loc}')
              print(json.dumps('\n'.join(vulns[:20])))
          except Exception:
              print(json.dumps(''))
          ")
              STATUS="[{\"source\":\"osv scan\",\"results\":[{\"kind\":\"warning\",\"title\":\"OSV vulnerability scan\",\"summary\":\"${VULN_COUNT} known vulnerabilit${VULN_PLURAL} found in pinned dependencies.\",\"detail\":${VULN_DETAIL},\"how_to_fix\":\"Review the findings in the detail field above, or re-run the job and check its log for the full list. Update the affected dependencies if a patched version is available.\"}]}]"
            else
              STATUS="[]"
            fi
          fi

          echo "review_status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "review_status=${STATUS}" > review-status.json

      - name: Upload review status artifact
        if: always() && steps.emit.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-osv-scanner
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
